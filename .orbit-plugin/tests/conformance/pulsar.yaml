# Goldens for `orbit plugin test .`: an empty plugin state and workspace, no network.
# Regenerate by running each input through `python -m pulsar orbit-tool` and
# reading the diff; outputs are compared exactly.
schemaVersion: 1
kind: PluginTest
tests:
- name: status_on_an_empty_home
  tool: status
  input: {}
  expect:
    output:
      default_account: null
      healthy: false
      attention:
      - no account is bound (`pulsar auth login --account x:<handle>`)
      accounts: []
- name: validate_reports_a_thread_with_digest_and_cost
  tool: validate
  input:
    plan:
      account: x:constworks
      posts:
      - text: Orbit v0.26 is out
      - text: 'Release notes: https://example.com/notes'
  expect:
    output:
      valid: true
      accounts:
      - account: x:constworks
        provider: x
        digest: sha256:cda630805b79544143bd8d16f7c012185102571d9ec85ad5dd6284aa3cc825b2
        estimated_cost_usd: 0.215
        reply_to: null
        quote: null
        not_before: null
        posts:
        - text: Orbit v0.26 is out
          length: 18
          max_length: 280
          has_url: false
          estimated_cost_usd: 0.015
          media: []
        - text: 'Release notes: https://example.com/notes'
          length: 38
          max_length: 280
          has_url: true
          estimated_cost_usd: 0.2
          media: []
        pricing_note: from the configured price table; verify on the provider's portal
- name: validate_bluesky_links_use_offline_tlds_for_bare_domains
  tool: validate
  input:
    plan:
      account: bsky:constworks.bsky.social
      posts:
      - text: reads config.toml and plugin.yaml with Node.js
      - text: example.com https://localhost/notes
  expect:
    output:
      valid: true
      accounts:
      - account: bsky:constworks.bsky.social
        provider: bsky
        digest: sha256:4783f6a78270d2fff2b1c670668a250c6a024ec7e7796e5184557ea7f649d451
        estimated_cost_usd: 0.0
        reply_to: null
        quote: null
        not_before: null
        posts:
        - text: reads config.toml and plugin.yaml with Node.js
          length: 46
          max_length: 300
          has_url: false
          estimated_cost_usd: 0.0
          media: []
        - text: example.com https://localhost/notes
          length: 35
          max_length: 300
          has_url: true
          estimated_cost_usd: 0.0
          media: []
        pricing_note: from the configured price table; verify on the provider's portal
- name: validate_counts_weighted_length
  tool: validate
  input:
    plan:
      account: x:constworks
      text: héllo 👋 wörld
  expect:
    output:
      valid: true
      accounts:
      - account: x:constworks
        provider: x
        digest: sha256:ea966286504437f987adfa3de088bd17867ebca5e085e89d76cd67214ce55f91
        estimated_cost_usd: 0.015
        reply_to: null
        quote: null
        not_before: null
        posts:
        - text: héllo 👋 wörld
          length: 14
          max_length: 280
          has_url: false
          estimated_cost_usd: 0.015
          media: []
        pricing_note: from the configured price table; verify on the provider's portal
- name: validate_reports_an_empty_plan_as_invalid
  tool: validate
  input:
    plan:
      account: x:constworks
      posts: []
  expect:
    output:
      valid: false
      error:
        code: invalid_plan
        message: 'plan.posts: must not be empty'
        retryable: false
        detail:
          at: plan.posts
- name: validate_reports_an_over_length_post
  tool: validate
  input:
    plan:
      account: x:constworks
      text: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  expect:
    output:
      valid: false
      error:
        code: invalid_text
        message: text is 281 weighted characters; limit is 280
        retryable: false
        detail:
          weighted_length: 281
          limit: 280
          post: 0
- name: validate_reports_a_credential_in_the_text
  tool: validate
  input:
    plan:
      account: x:constworks
      text: deploy key ghp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  expect:
    output:
      valid: false
      error:
        code: secret_detected
        message: post text contains something that looks like a credential
        retryable: false
        detail:
          matched:
          - github token
          post: 0
- name: validate_without_an_account_or_default
  tool: validate
  input:
    plan:
      text: hello
  expect:
    error:
      code: auth_expired
- name: validate_needs_exactly_one_of_plan_or_source
  tool: validate
  input: {}
  expect:
    error:
      code: invalid_argument
- name: validate_refuses_a_source_outside_the_workspace
  tool: validate
  input:
    source: ../outside.yaml
  expect:
    error:
      code: invalid_argument
- name: history_on_an_empty_ledger
  tool: history
  input:
    limit: 5
  expect:
    output:
      rows: []
      total: 0
      truncated: false
- name: history_looks_up_keys_on_an_empty_ledger
  tool: history
  input:
    keys:
    - release:orbit:v0.26.0
    - repo:pulsar
  expect:
    output:
      rows: []
      total: 0
      truncated: false
- name: validate_reports_a_plans_key
  tool: validate
  input:
    plan:
      account: x:constworks
      key: release:orbit:v0.26.0
      text: Orbit v0.26.0 is out
  expect:
    output:
      valid: true
      accounts:
      - account: x:constworks
        provider: x
        digest: sha256:4cc9a4e2ffa97c94d99c1a2ab25f2ca388046fccde4082df195efe6253a5ddd9
        estimated_cost_usd: 0.015
        reply_to: null
        quote: null
        not_before: null
        key: release:orbit:v0.26.0
        posts:
        - text: Orbit v0.26.0 is out
          length: 20
          max_length: 280
          has_url: false
          estimated_cost_usd: 0.015
          media: []
        pricing_note: from the configured price table; verify on the provider's portal
- name: history_for_an_unknown_account
  tool: history
  input:
    account: x:nobody
  expect:
    error:
      code: unknown_account
- name: engagements_needs_a_bound_account
  tool: engagements
  input:
    hours: 24
  expect:
    error:
      code: auth_expired
- name: metrics_needs_a_bound_account
  tool: metrics
  input:
    days: 7
  expect:
    error:
      code: auth_expired
- name: publish_refuses_a_missing_source
  tool: publish
  input:
    source: missing.yaml
    dry_run: true
  expect:
    error:
      code: invalid_argument
- name: dispatch_without_a_plan_location_does_nothing
  tool: dispatch
  input: {}
  expect:
    output:
      dry_run: false
      patterns: []
      scanned: 0
      truncated: false
      reconciled: []
      published: []
      ready: []
      skipped: []
      errors: []
      note: 'no plan location is configured: set [dispatch] plans (workspace-relative globs) in config.toml in the pulsar home'
- name: dispatch_dry_run_without_a_plan_location
  tool: dispatch
  input:
    dry_run: true
  expect:
    output:
      dry_run: true
      patterns: []
      scanned: 0
      truncated: false
      reconciled: []
      published: []
      ready: []
      skipped: []
      errors: []
      note: 'no plan location is configured: set [dispatch] plans (workspace-relative globs) in config.toml in the pulsar home'
- name: validate_a_020_release_plan_for_x_and_bluesky
  tool: validate
  input:
    plan:
      accounts:
      - x:constworks
      - bsky:constworks.bsky.social
      text: 'pulsar 0.2.0 is out: https://example.com/notes'
  expect:
    output:
      valid: true
      accounts:
      - account: bsky:constworks.bsky.social
        provider: bsky
        digest: sha256:9c064988a027dc2ebc359f4f9db91d948bfccda039d0f9c66c781eb007e5cd2d
        estimated_cost_usd: 0.0
        reply_to: null
        quote: null
        not_before: null
        posts:
        - text: 'pulsar 0.2.0 is out: https://example.com/notes'
          length: 46
          max_length: 300
          has_url: true
          estimated_cost_usd: 0.0
          media: []
        pricing_note: from the configured price table; verify on the provider's portal
      - account: x:constworks
        provider: x
        digest: sha256:9c064988a027dc2ebc359f4f9db91d948bfccda039d0f9c66c781eb007e5cd2d
        estimated_cost_usd: 0.2
        reply_to: null
        quote: null
        not_before: null
        posts:
        - text: 'pulsar 0.2.0 is out: https://example.com/notes'
          length: 44
          max_length: 280
          has_url: true
          estimated_cost_usd: 0.2
          media: []
        pricing_note: from the configured price table; verify on the provider's portal
